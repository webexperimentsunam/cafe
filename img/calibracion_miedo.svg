           C 678 980, 650 972, 627 972
           C 604 972, 576 980, 544 981
           C 484 982, 432 968, 412 927 Z"
        fill="#FFFFFF" stroke="#1F232B" stroke-width="22" stroke-linejoin="round"/>

  <!-- Mouth inner fear shadow -->
  <path d="M442 882
           C 492 850, 563 840, 627 840
           C 691 840, 762 850, 812 882
           C 803 923, 766 949, 711 952
           C 678 954, 649 948, 627 948
           C 605 948, 576 954, 543 952
           C 488 949, 451 923, 442 882 Z"
