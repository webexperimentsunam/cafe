<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" fill="none">
  <title>Emoticono de miedo</title>
  <desc>Emoji circular amarillo con expresión de miedo, cejas levantadas, ojos muy abiertos y boca tensa abierta.</desc>

  <!-- Face -->
  <circle cx="627" cy="627" r="548" fill="#F7D355" stroke="#1F232B" stroke-width="26"/>

  <!-- Eyebrows -->
  <path d="M330 390 C 405 370, 455 325, 505 275" stroke="#1F232B" stroke-width="38" stroke-linecap="round" fill="none"/>
  <path d="M924 390 C 849 370, 799 325, 749 275" stroke="#1F232B" stroke-width="38" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <ellipse cx="438" cy="611" rx="95" ry="140" fill="#FFFFFF" stroke="#1F232B" stroke-width="22"/>
  <ellipse cx="816" cy="611" rx="95" ry="140" fill="#FFFFFF" stroke="#1F232B" stroke-width="22"/>
  <ellipse cx="438" cy="611" rx="33" ry="40" fill="#1F232B"/>
  <ellipse cx="816" cy="611" rx="33" ry="40" fill="#1F232B"/>

  <!-- Mouth outer -->
  <path d="M412 864
           C 432 807, 482 774, 545 776
           C 575 777, 601 787, 627 787
           C 653 787, 679 777, 709 776
           C 772 774, 822 807, 842 864
           L 842 927
